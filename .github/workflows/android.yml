name: Build BookForge APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build test APK and release AAB
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease
      - name: Verify build artifacts
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: BookForge-v1.0.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BookForge-v1.0.0-AAB-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
