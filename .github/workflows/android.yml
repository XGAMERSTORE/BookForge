name: Build BookForge APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate editor JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs'), vm = require('vm');
          const html = fs.readFileSync('app/src/main/assets/index.html','utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if(!script)throw Error('Editor JavaScript not found');
          new vm.Script(script,{filename:'bookforge-editor.js'});
          for(const marker of ['function makeEpub','function pageFolio','function refreshPageVisibility','function compressImage'])if(!script.includes(marker))throw Error('Missing '+marker);
          console.log('Editor JavaScript syntax OK; length='+script.length);
          NODE
      - name: Build test APK and release AAB
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease
      - name: Verify build artifacts
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: BookForge-v1.1.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BookForge-v1.1.0-AAB-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
