<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#151421" />
<title>BookForge – editor knih</title>
<style>
:root{color-scheme:dark;--bg:#0f1019;--panel:#191a28;--surface:#232435;--line:#363749;--ink:#f6f0fb;--muted:#a8a7ba;--accent:#d39af4;--accent2:#a66dd7;--paper:#fffefa;--shadow:0 15px 40px #0008}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}
.app{height:100dvh;min-height:480px;display:flex;flex-direction:column;overflow:hidden}.top{background:#161522;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 13px;min-height:61px;flex-shrink:0;z-index:6}.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;font-weight:800;letter-spacing:-.5px}.brand-icon{height:34px;width:34px;display:grid;place-items:center;border-radius:11px;color:#210c2e;background:linear-gradient(140deg,#f3d0ff,#b980df);font-size:22px}.top-middle{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.bookname{font-size:15px;font-weight:700;color:#f7f1fc;min-width:0;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;cursor:pointer}.saved{font-size:11px;color:#a9cbb3;white-space:nowrap}.actions{display:flex;align-items:center;gap:6px}.btn,.iconbtn,select,.smallinput{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;min-height:35px;padding:7px 11px}.iconbtn{padding:5px 9px;font-size:18px;min-width:35px}.btn:hover,.iconbtn:hover,.toolbtn:hover{background:#323147}.btn.accent{color:#201027;background:var(--accent);border-color:var(--accent)}.btn.primary{background:linear-gradient(135deg,#c88eea,#e7b8fd);color:#25132a;font-weight:700;border:none}.btn.small{font-size:12px;min-height:30px;padding:5px 8px}.mobile-menu{display:none}
.toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:#1b1b2a;border-bottom:1px solid var(--line);padding:8px 12px;flex-shrink:0}.toolgroup{display:flex;gap:3px;align-items:center;padding-right:9px;margin-right:5px;border-right:1px solid #444155}.toolgroup:last-child{border:none}.toolbtn{min-width:33px;height:33px;border:1px solid transparent;background:transparent;color:#eae4ee;border-radius:7px;font-size:15px}.toolbtn.active{background:#563368;color:#ffddff}.toolbtn[title="Tučné"]{font-weight:900}.toolbtn[title="Kurzíva"]{font-style:italic}.toolbtn[title="Podtržení"]{text-decoration:underline}.toolbar select{height:33px;min-height:33px;padding:4px 7px;font-size:12px;max-width:110px}.toolbar input[type=color]{height:32px;width:31px;border:none;border-radius:6px;padding:3px;background:#343045;cursor:pointer}.formatpicker{max-width:90px}.main{display:flex;flex:1;min-height:0}.sidebar{width:232px;flex-shrink:0;display:flex;flex-direction:column;background:#171826;border-right:1px solid var(--line);padding:15px 11px;gap:13px;z-index:5}.sidetitle{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:0 8px}.sidebar-heading{display:flex;justify-content:space-between;align-items:center;gap:6px}.sidebar-heading button{border:0;background:transparent;color:var(--accent);font-size:20px}.chapterlist{display:flex;flex-direction:column;gap:5px;overflow:auto;flex:1}.chapter{display:flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:9px;padding:8px 7px;background:transparent;color:#c6c1d0;text-align:left}.chapter.selected{background:#392847;border-color:#664775;color:#fff}.chaptertitle{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chapter-number{font-size:11px;color:#b1a5bf;width:18px}.chapter-options{font-size:16px;border:0;color:#a99bb3;background:transparent}.sidefooter{font-size:12px;color:var(--muted);border-top:1px solid #3b3a4a;padding:12px 7px 3px;line-height:1.8}.sidefooter b{color:#efe3f2}
.workspace{display:flex;flex-direction:column;flex:1;min-width:0;background:radial-gradient(circle at 45% 0%,#252136 0%,#141520 65%)}.ribbon{padding:9px 13px;display:flex;flex-wrap:wrap;align-items:center;gap:9px;border-bottom:1px solid #393446;background:#1b1929;min-height:48px;flex-shrink:0}.ribbon .label{color:#bcb1c9;font-size:12px}.ribbon select,.ribbon button{font-size:12px;min-height:30px}.ribbon .spacer{flex:1}.zoomtext{color:#e9c9fc;min-width:36px;text-align:right;font-size:12px}.zoomslider{accent-color:#cc94e6;width:90px}.canvas{position:relative;flex:1;overflow:auto;overscroll-behavior:contain;padding:25px 30px 65px;scrollbar-color:#786284 transparent;scrollbar-width:thin}.spread{display:flex;align-items:flex-start;justify-content:flex-start;gap:25px;width:max-content;min-height:100%}.spread.single{gap:20px}.pagewrap{flex-shrink:0;display:flex;flex-direction:column;gap:8px;align-items:center}.pagewrap[hidden]{display:none!important}.pagelabel{color:#bcaac8;font-size:11px}.page{background:var(--paper);position:relative;color:#212025;box-shadow:var(--shadow);flex-shrink:0;box-sizing:border-box;outline:3px solid transparent;outline-offset:3px;transition:outline-color .12s;overflow:hidden}.page.selected{outline-color:#d79be6}.page[data-size="A4"]{width:210mm;height:297mm}.page[data-size="A5"]{width:148mm;height:210mm}.page-body{outline:none;white-space:normal;overflow:hidden;font-size:14pt;line-height:1.55;font-family:Georgia,"Times New Roman",serif;position:absolute;inset:0;box-sizing:border-box;padding:19mm 17mm 19mm 17mm;word-break:break-word}.page[data-size="A5"] .page-body{padding:14mm 13mm}.page-body h1{font-size:24pt;line-height:1.2;margin:0 0 12pt}.page-body h2{font-size:18pt;line-height:1.25;margin:0 0 10pt}.page-body h3{font-size:15pt;margin:0 0 8pt}.page-body p,.page-body div{margin:0 0 8pt}.page-body ul,.page-body ol{padding-left:24pt;margin:3pt 0 8pt}.page-body blockquote{margin:8pt 10pt;border-left:3px solid #6b476c;padding-left:10pt}.page-body:empty:before{content:'Začni psát svůj příběh…';color:#bcb7bb;pointer-events:none}.pagenum{position:absolute;bottom:8mm;left:0;right:0;font:11pt Georgia,serif;color:#777;text-align:center;pointer-events:none}.page[data-size="A5"] .pagenum{bottom:6mm}.status{min-height:28px;flex-shrink:0;background:#171724;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:4px 15px;font-size:11px;color:#c5bad2;gap:12px}.status strong{color:#eccaf8}.hint{color:#a69bb1}.toast{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:#41304f;color:#fff;padding:10px 17px;border-radius:11px;box-shadow:0 9px 30px #0008;display:none;z-index:30;font-size:13px;max-width:92vw;text-align:center}.toast.visible{display:block}.overlay{position:fixed;inset:0;background:#05040ba9;z-index:15;display:none;align-items:center;justify-content:center;padding:18px}.overlay.visible{display:flex}.modal{width:min(440px,100%);background:#211f30;color:var(--ink);padding:23px;box-shadow:0 22px 70px #0009;border-radius:15px;border:1px solid #574466}.modal h2{font-size:19px;margin:0 0 16px}.modal label{display:block;margin:12px 0 6px;font-size:12px;color:#cac0cf}.modal input,.modal select{width:100%;background:#171622;border:1px solid #5e4d69;color:#faf1fa;border-radius:9px;padding:11px;outline:none}.modalactions{margin-top:20px;display:flex;justify-content:flex-end;gap:8px}.modal p{font-size:13px;color:#c5bdcc;line-height:1.6}.hidden{display:none!important}
@media(max-width:890px){.sidebar{position:absolute;top:109px;bottom:28px;left:0;transform:translateX(-102%);box-shadow:10px 0 30px #0008;transition:transform .2s}.sidebar.open{transform:none}.mobile-menu{display:inline-block}.brand-text{display:none}.toolbar{padding:6px;gap:1px}.toolgroup{margin-right:2px;padding-right:3px}.toolbtn{min-width:29px;height:31px}.canvas{padding:18px 20px 52px}.spread{gap:15px}.ribbon{padding:7px;gap:6px}}
@media(max-width:500px){.top{padding:7px;gap:6px;min-height:53px}.saved{display:none}.actions .textLabel{display:none}.actions .btn{padding:6px 9px;min-height:34px}.brand-icon{height:31px;width:31px}.sidebar{top:99px}.toolbar select{max-width:75px}.toolbar .groupoptional{display:none}.ribbon .label{display:none}.zoomslider{width:66px}.hint{display:none}.canvas{padding:15px 15px 45px}.status{font-size:10px;padding:5px 8px}}
@media print{html,body{background:white!important}.top,.toolbar,.sidebar,.ribbon,.status,.toast,.overlay{display:none!important}.app,.main,.workspace,.canvas,.spread{display:block!important;position:static!important;overflow:visible!important;height:auto!important;width:auto!important;min-height:0!important;background:none!important;margin:0!important;padding:0!important}.pagewrap{display:block!important;break-after:page;margin:0!important;padding:0!important}.page{box-shadow:none!important;outline:none!important;zoom:1!important;border:none!important;break-inside:avoid!important}.pagelabel{display:none!important}}

.canvas{padding:14px 10px 32px}.spread{margin-left:auto;margin-right:auto;gap:10px;justify-content:center;min-height:0}.spread-controls{display:flex;align-items:center;gap:6px;border-radius:10px;padding:3px 6px;background:#2d2440}.spread-controls strong{min-width:67px;font-size:12px;text-align:center;color:#edcaff;white-space:nowrap}#fitBtn.active{background:#e6b7ff;color:#23142d}
@media(max-width:550px){.spread{gap:4px}.canvas{padding:10px 4px 24px}.spread-controls{order:-2}#fitBtn{order:-1}.ribbon{gap:5px}.toolbar{max-height:130px;overflow-y:auto}}

.page-body img{display:block;height:auto;max-width:100%;margin:7px auto}.page-body table{border-collapse:collapse;width:100%;max-width:100%;margin:8px 0}.page-body th,.page-body td{border:1px solid #aaa;padding:5px;min-width:28px}.modal textarea{box-sizing:border-box;display:block;width:100%;background:#171622;color:#faf1fa;border:1px solid #5e4d69;border-radius:9px;padding:10px;font:inherit;min-height:90px}.coverPreview{display:block;max-height:130px;max-width:100%;object-fit:contain;margin:8px auto}.page[data-size="A5"] .page-body,.page[data-size="A4"] .page-body{box-sizing:border-box}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="iconbtn mobile-menu" id="menuToggle" aria-label="Otevřít kapitoly">☰</button>
    <div class="brand"><span class="brand-icon">✒</span><span class="brand-text">BookForge</span></div>
    <div class="top-middle"><span id="bookTitle" class="bookname" role="button" tabindex="0" title="Upravit název knihy">Moje kniha</span><span id="saveStatus" class="saved">● Uloženo</span></div>
    <div class="actions">
      <button class="btn small" id="booksBtn" title="Moje knihy">📚 <span class="textLabel">Knihy</span></button>
      <button class="btn small" id="importBtn" title="Importovat zálohu">↥</button>
      <button class="btn small" id="exportBtn" title="Exportovat knihu">↧ <span class="textLabel">Export</span></button>
      <button class="btn primary" id="pdfBtn" title="Tisk nebo uložit jako PDF">PDF</button>
    </div>
  </header>
  <div class="toolbar" id="toolbar">
    <div class="toolgroup">
      <select id="paraStyle" title="Styl odstavce"><option value="p">Text</option><option value="h1">Nadpis 1</option><option value="h2">Nadpis 2</option><option value="h3">Nadpis 3</option></select>
      <select id="fontFamily" title="Písmo"><option value="Georgia">Georgia</option><option value="Arial">Arial</option><option value="Times New Roman">Times</option><option value="Verdana">Verdana</option></select>
      <select id="fontSize" title="Velikost písma"><option value="2">10 pt</option><option value="3" selected>12 pt</option><option value="4">14 pt</option><option value="5">18 pt</option><option value="6">24 pt</option><option value="7">32 pt</option></select>
    </div>
    <div class="toolgroup"><button class="toolbtn" title="Tučné" data-cmd="bold">B</button><button class="toolbtn" title="Kurzíva" data-cmd="italic">I</button><button class="toolbtn" title="Podtržení" data-cmd="underline">U</button><input type="color" id="textColor" value="#212025" title="Barva textu"/></div>
    <div class="toolgroup"><button class="toolbtn" title="Vlevo" data-cmd="justifyLeft">☰</button><button class="toolbtn" title="Na střed" data-cmd="justifyCenter">≡</button><button class="toolbtn" title="Vpravo" data-cmd="justifyRight">☷</button><button class="toolbtn" title="Do bloku" data-cmd="justifyFull">▤</button></div>
    <div class="toolgroup"><button class="toolbtn" title="Odrážky" data-cmd="insertUnorderedList">•≡</button><button class="toolbtn" title="Číslovaný seznam" data-cmd="insertOrderedList">1≡</button></div>
    <div class="toolgroup groupoptional"><button class="toolbtn" title="Zpět" data-cmd="undo">↶</button><button class="toolbtn" title="Znovu" data-cmd="redo">↷</button></div>
    <button class="btn small" id="insertImage">🖼 Obrázek</button><button class="btn small" id="insertTable">▦ Tabulka</button><button class="btn small" id="insertLink">🔗 Odkaz</button><button class="btn small" id="bookSettings">⚙ Kniha</button><button class="toolbtn" data-cmd="strikeThrough" title="Přeškrtnutí">S̶</button><button class="toolbtn" data-cmd="indent" title="Odsadit">⇥</button><button class="toolbtn" data-cmd="outdent" title="Odsazení zpět">⇤</button><input type="color" id="highlightColor" value="#fff2ab" title="Zvýraznit"/><button class="btn small" id="findBtn">⌕ Najít</button>
  </div>
  <div class="main">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-heading"><span class="sidetitle">Kapitoly</span><button id="newChapter" title="Nová kapitola">＋</button></div>
      <div class="chapterlist" id="chapterList"></div>
      <button class="btn small" id="renameChapter">✎ Přejmenovat kapitolu</button>
      <button class="btn small" id="deleteChapter">⌫ Smazat kapitolu</button>
      <div class="sidefooter"><div>Celá kniha: <b id="allWords">0 slov</b></div><div>Lokálně a automaticky ukládáno</div></div>
    </aside>
    <main class="workspace">
      <div class="ribbon">
        <span class="label">List:</span>
        <select id="paperSize" title="Velikost vybrané stránky"><option value="A3">A3 · 297 × 420 mm</option><option value="A4">A4 · 210 × 297 mm</option><option value="A5">A5 · 148 × 210 mm</option><option value="A6">A6 · 105 × 148 mm</option><option value="B5">B5 · 176 × 250 mm</option><option value="LETTER">LETTER · 216 × 279 mm</option><option value="LEGAL">LEGAL · 216 × 356 mm</option><option value="SQUARE">SQUARE · 210 × 210 mm</option><option value="CUSTOM">Vlastní · 148 × 210 mm</option></select>
        <button class="btn small" id="pageSetup">⚙ Formát</button><button class="btn small" id="newPage">+ Stránka</button>
        <button class="btn small" id="deletePage">− Stránka</button>
        <select id="viewMode" title="Rozložení stránky"><option value="spread">▣ Dvojstrana</option><option value="single">▯ Jedna stránka</option></select>
        <div class="spread-controls"><button class="btn small" id="prevSpread" title="Předchozí dvojstrana">❮</button><strong id="spreadLabel">1–2 / 2</strong><button class="btn small" id="nextSpread" title="Další dvojstrana">❯</button></div><button class="btn small" id="fitBtn">⇲ Dvě na střed</button><div class="spacer"></div>
        <span class="label">Přiblížení:</span><button class="btn small" id="zoomOut" title="Oddálit">−</button>
        <input class="zoomslider" id="zoomSlider" type="range" min="15" max="200" step="5" value="50" aria-label="Přiblížení" />
        <button class="btn small" id="zoomIn" title="Přiblížit">+</button><span class="zoomtext" id="zoomValue">50 %</span>
      </div>
      <div class="canvas" id="canvas" aria-label="Uprostřed je vidět pouze aktuální dvojstrana"><div class="spread" id="spread"></div></div>
    </main>
  </div>
  <footer class="status"><span id="pageStats">Strana 1 · 0 slov</span><span class="hint">Tip: dvojstranu na mobilu posuneš prstem · přibliž pro psaní</span><strong id="chapterInfo">Kapitola 1</strong></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<input type="file" id="importFile" accept=".json,application/json,.txt,text/plain,.html,text/html" class="hidden" /><input type="file" id="imageFile" accept="image/jpeg,image/png,image/webp" class="hidden"/><input type="file" id="coverFile" accept="image/jpeg,image/png,image/webp" class="hidden"/>
<script>
'use strict';
const STORE='bookforge-v1-library';
const $=id=>document.getElementById(id);
const $all=(query,root=document)=>Array.from(root.querySelectorAll(query));
let state,activeBody=null,selectedPage=0,saveTimer=null,toastTimer=null,layoutBusy=false;
const uid=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,9);
const makeChapter=(title='Kapitola 1')=>({id:uid(),title,pages:[{id:uid(),size:'A5',html:''},{id:uid(),size:'A5',html:''}]});
const PAGE_FORMATS={"A3":[297,420],"A4":[210,297],"A5":[148,210],"A6":[105,148],"B5":[176,250],"LETTER":[216,279],"LEGAL":[216,356],"SQUARE":[210,210],"CUSTOM":[148,210]};
const mm2px=mm=>mm*96/25.4;
function chapterOffset(){const book=getBook();return book.chapters.slice(0,Math.max(0,book.chapters.findIndex(c=>c.id===state.activeChapter))).reduce((n,c)=>n+c.pages.length,0);}
function pageFolio(n){const p=getBook().pageNumbers||{};if(p.enabled===false)return '';n+=Math.max(1,Number(p.start)||1)-1;if(p.style!=='roman')return String(n);const units=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const [v,ch] of units){while(n>=v){s+=ch;n-=v;}}return s.toLowerCase();}
function dimensions(p){const x=PAGE_FORMATS[p.size]||PAGE_FORMATS.A5;const w=p.size==='CUSTOM'?(Number(p.width)||148):x[0],h=p.size==='CUSTOM'?(Number(p.height)||210):x[1];return p.orientation==='landscape'?[h,w]:[w,h];}
const makeBook=(title='Moje kniha')=>({id:uid(),title,author:'',isbn:'',description:'',cover:'',pageNumbers:{enabled:true,start:1,style:'arabic',position:'center'},margins:{top:15,right:14,bottom:17,left:14},chapters:[makeChapter()]});
function defaultState(){const book=makeBook();return {books:[book],activeBook:book.id,activeChapter:book.chapters[0].id,zoom:50,fit:true,view:'spread'};}
function sanitizeHtml(input){const template=document.createElement('template');template.innerHTML=String(input||'');const allowed=new Set(['P','DIV','BR','B','STRONG','I','EM','U','S','STRIKE','H1','H2','H3','UL','OL','LI','SPAN','FONT','BLOCKQUOTE','SUP','SUB','IMG','TABLE','TBODY','THEAD','TR','TH','TD','A','HR']);for(const child of $all('*',template.content)){if(!allowed.has(child.tagName)){child.replaceWith(...Array.from(child.childNodes));continue;}for(const attr of Array.from(child.attributes)){const n=attr.name.toLowerCase();if(n==='style'){const approved=attr.value.split(';').filter(p=>/^\s*(color|background-color|font-size|font-family|font-weight|font-style|text-decoration|text-align|line-height|width|height|background|border|margin|padding)\s*:/i.test(p)).join(';');if(approved)child.setAttribute('style',approved);else child.removeAttribute('style');}else if((child.tagName==='IMG'&&n==='src'&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(attr.value)&&attr.value.length<2500000)||(child.tagName==='IMG'&&['alt','width','height'].includes(n))||(child.tagName==='A'&&n==='href'&&/^https?:\/\//.test(attr.value))||n==='align'||(child.tagName==='FONT'&&['color','size','face'].includes(n))){continue;}else child.removeAttribute(attr.name);}}return template.innerHTML;}
function validateState(raw){if(!raw||!Array.isArray(raw.books)||!raw.books.length)throw Error('Neplatný soubor knih.');const books=raw.books.slice(0,100).map(b=>({id:String(b.id||uid()),title:String(b.title||'Bez názvu').slice(0,150),author:String(b.author||'').slice(0,150),isbn:String(b.isbn||'').slice(0,70),description:String(b.description||'').slice(0,4000),cover:/^data:image\/(jpeg|png|webp);base64,/.test(b.cover||'')?b.cover:'',pageNumbers:{enabled:b.pageNumbers?.enabled!==false,start:Math.max(1,Number(b.pageNumbers?.start)||1),style:b.pageNumbers?.style==='roman'?'roman':'arabic',position:['left','center','right'].includes(b.pageNumbers?.position)?b.pageNumbers.position:'center'},margins:Object.fromEntries(['top','right','bottom','left'].map(k=>[k,Math.max(4,Math.min(40,Number(b.margins?.[k]??({top:15,right:14,bottom:17,left:14})[k])))])),chapters:(Array.isArray(b.chapters)&&b.chapters.length?b.chapters:[makeChapter()]).slice(0,500).map(c=>({id:String(c.id||uid()),title:String(c.title||'Kapitola'),pages:(Array.isArray(c.pages)&&c.pages.length?c.pages:[{id:uid(),size:'A5',html:''}]).slice(0,1000).map(p=>({id:String(p.id||uid()),size:PAGE_FORMATS[p.size]?p.size:'A5',width:Number(p.width)||148,height:Number(p.height)||210,orientation:p.orientation==='landscape'?'landscape':'portrait',html:sanitizeHtml(p.html)}))}))}));const book=books.find(b=>b.id===raw.activeBook)||books[0];const ch=book.chapters.find(c=>c.id===raw.activeChapter)||book.chapters[0];return {books,activeBook:book.id,activeChapter:ch.id,zoom:Number.isFinite(Number(raw.zoom))?Math.min(200,Math.max(15,Math.round(Number(raw.zoom)/5)*5)):50,fit:raw.fit!==false,view:raw.view==='single'?'single':'spread'};}
function load(){try{const native=(window.AndroidBridge&&typeof window.AndroidBridge.readLibrary==='function')?window.AndroidBridge.readLibrary():'';const saved=native||localStorage.getItem(STORE);return saved?validateState(JSON.parse(saved)):defaultState();}catch(e){console.warn('Načítání:',e);return defaultState();}}
function getBook(){return state.books.find(b=>b.id===state.activeBook)||state.books[0];}
function getChapter(){const b=getBook();return b.chapters.find(c=>c.id===state.activeChapter)||b.chapters[0];}
function flushDOM(){const pages=getChapter().pages;$all('.page-body').forEach((el,i)=>{if(pages[i])pages[i].html=el.innerHTML;});}
function saveNow(){flushDOM();const json=JSON.stringify(state);let saved=false;try{if(window.AndroidBridge&&typeof window.AndroidBridge.writeLibrary==='function'){window.AndroidBridge.writeLibrary(json);saved=true;}}catch(e){console.warn('Nativní uložení selhalo:',e);}try{localStorage.setItem(STORE,json);saved=true;}catch(e){console.warn('Uložení prohlížeče:',e);}if(saved){$('saveStatus').textContent='● Uloženo';$('saveStatus').style.color='#a9cbb3';}else{$('saveStatus').textContent='! Úložiště plné';$('saveStatus').style.color='#ffbfba';showToast('Nepodařilo se uložit. Exportuj zálohu.');}}
function scheduleSave(){ $('saveStatus').textContent='● Ukládám…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveNow();refreshStats()},280);}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),2900);}
function openModal(title,body,actions){$('modal').innerHTML='';const h=document.createElement('h2');h.textContent=title;$('modal').append(h);const content=document.createElement('div');content.innerHTML=body;$('modal').append(content);const footer=document.createElement('div');footer.className='modalactions';for(const a of actions){const btn=document.createElement('button');btn.className='btn '+(a.primary?'primary':'');btn.textContent=a.text;btn.addEventListener('click',()=>a.fn());footer.append(btn);}$('modal').append(footer);$('overlay').classList.add('visible');const first=$('modal').querySelector('input:not([type=file])');if(first)setTimeout(()=>first.focus(),40);}
function closeModal(){$('overlay').classList.remove('visible');$('modal').innerHTML='';}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('sidebar').classList.remove('open');closeModal();}});
function renderChapters(){const b=getBook(),list=$('chapterList');list.innerHTML='';b.chapters.forEach((c,i)=>{const line=document.createElement('button');line.className='chapter'+(c.id===state.activeChapter?' selected':'');line.innerHTML='<span class="chapter-number">'+(i+1)+'.</span><span class="chaptertitle"></span>';line.querySelector('.chaptertitle').textContent=c.title;line.addEventListener('click',()=>{saveNow();state.activeChapter=c.id;selectedPage=0;render();$('sidebar').classList.remove('open');saveNow();});list.append(line);});$('chapterInfo').textContent=getChapter().title;}
function makePageNode(data,index){const wrap=document.createElement('div');wrap.className='pagewrap';wrap.dataset.pageIndex=index;const page=document.createElement('article');page.className='page';page.dataset.size=data.size;const [w,h]=dimensions(data);page.style.width=w+'mm';page.style.height=h+'mm';page.dataset.pageId=data.id;page.style.zoom=state.zoom+'%';page.setAttribute('aria-label','Stránka '+(index+1));const editor=document.createElement('div');editor.className='page-body';const m=getBook().margins||{top:15,right:14,bottom:17,left:14};editor.style.padding=[m.top,m.right,m.bottom,m.left].map(x=>x+'mm').join(' ');editor.contentEditable='true';editor.spellcheck=true;editor.setAttribute('role','textbox');editor.setAttribute('aria-multiline','true');editor.setAttribute('aria-label','Text strany '+(index+1));editor.innerHTML=data.html||'';const num=document.createElement('div');num.className='pagenum';num.textContent=pageFolio(chapterOffset()+index+1);num.style.textAlign=getBook().pageNumbers?.position||'center';page.append(editor,num);const label=document.createElement('div');label.className='pagelabel';label.textContent='STRANA '+(index+1)+' · '+data.size;wrap.append(page,label);
page.addEventListener('pointerdown',()=>selectPage(index,false));editor.addEventListener('focus',()=>{activeBody=editor;selectPage(Number(wrap.dataset.pageIndex),false);});editor.addEventListener('input',()=>{const idx=Number(wrap.dataset.pageIndex);getChapter().pages[idx].html=editor.innerHTML;scheduleSave();setTimeout(()=>paginate(),30);});editor.addEventListener('paste',e=>{e.preventDefault();const plain=e.clipboardData.getData('text/plain');document.execCommand('insertText',false,plain);});editor.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ');}if(e.key==='PageDown'&&e.ctrlKey){e.preventDefault();selectPage(Math.min(getChapter().pages.length-1,Number(wrap.dataset.pageIndex)+1),true);}});
return wrap;}

function selectPage(index,focus){const n=getChapter().pages.length;selectedPage=Math.min(n-1,Math.max(0,index));$all('.page').forEach((p,i)=>p.classList.toggle('selected',i===selectedPage));$('paperSize').value=getChapter().pages[selectedPage].size;refreshStats();refreshPageVisibility();updateZoom();if(focus){const el=$all('.page-body')[selectedPage];if(el){activeBody=el;el.focus({preventScroll:true});}}}
function refreshPageVisibility(){const wraps=$all('.pagewrap');const start=state.view==='single'?selectedPage:Math.floor(selectedPage/2)*2;
 wraps.forEach((w,i)=>w.hidden=state.view==='single'?i!==selectedPage:i<start||i>=start+2);
 $('spread').classList.toggle('single',state.view==='single');
 $('spreadLabel').textContent=(start+1)+(state.view==='single'?'':'–'+Math.min(start+2,wraps.length))+' / '+wraps.length;
 $('prevSpread').disabled=start===0;$('nextSpread').disabled=start+(state.view==='single'?1:2)>=wraps.length;
}
function renderPages(){const root=$('spread');root.innerHTML='';getChapter().pages.forEach((p,i)=>root.append(makePageNode(p,i)));refreshPageVisibility();selectPage(Math.min(selectedPage,getChapter().pages.length-1),false);updateZoom();}
function render(){const b=getBook();$('bookTitle').textContent=b.title;renderChapters();renderPages();$('viewMode').value=state.view;refreshStats();}
function updateZoom(){if(state.fit){const from=state.view==='single'?selectedPage:Math.floor(selectedPage/2)*2;const show=getChapter().pages.slice(from,from+(state.view==='single'?1:2));const width=show.reduce((sum,p)=>sum+mm2px(dimensions(p)[0]),0)+(show.length>1?10:0);state.zoom=Math.max(15,Math.min(150,Math.floor(100*Math.max(120,$('canvas').clientWidth-24)/Math.max(width,1))));}
 $('zoomSlider').value=state.zoom;$('zoomValue').textContent=state.zoom+' %';$('fitBtn').classList.toggle('active',!!state.fit);$all('.page').forEach(p=>p.style.zoom=state.zoom+'%');}
function refreshStats(){const chapter=getChapter();const count=h=>{const d=document.createElement('div');d.innerHTML=h||'';return (d.textContent||'').trim().split(/\s+/).filter(Boolean).length;};const total=state.books.find(b=>b.id===state.activeBook).chapters.reduce((acc,c)=>acc+c.pages.reduce((s,p)=>s+count(p.html),0),0);const current=chapter.pages[selectedPage];$('allWords').textContent=total+' slov';$('pageStats').textContent='Strana '+(selectedPage+1)+' / '+chapter.pages.length+' · '+count(current?.html)+' slov na straně';}
function addPage(after=selectedPage,size=null){flushDOM();const pages=getChapter().pages;const p={id:uid(),size:size||pages[after]?.size||'A5',orientation:pages[after]?.orientation||'portrait',width:pages[after]?.width||148,height:pages[after]?.height||210,html:''};pages.splice(after+1,0,p);const wraps=$all('.pagewrap');const newEl=makePageNode(p,after+1);if(wraps[after])wraps[after].after(newEl);else $('spread').append(newEl);renumberPages();scheduleSave();return newEl;}
function renumberPages(){getChapter().pages.forEach((p,i)=>{const el=$all('.pagewrap')[i];if(!el)return;el.dataset.pageIndex=i;el.querySelector('.pagenum').textContent=pageFolio(chapterOffset()+i+1);el.querySelector('.pagenum').style.textAlign=getBook().pageNumbers?.position||'center';el.querySelector('.pagelabel').textContent='STRANA '+(i+1)+' · '+p.size;el.querySelector('.page').dataset.size=p.size;const [pw,ph]=dimensions(p);el.querySelector('.page').style.width=pw+'mm';el.querySelector('.page').style.height=ph+'mm';el.querySelector('.page').style.zoom=state.zoom+'%';});refreshPageVisibility();selectPage(selectedPage,false);}
function getNextBody(i){const pages=getChapter().pages;if(i+1>=pages.length)addPage(i,pages[i].size);return $all('.page-body')[i+1];}
function firstContentNode(body){return Array.from(body.childNodes).find(n=>!(n.nodeType===3&&!n.textContent.trim()));}
function overflow(body){return body.scrollHeight>body.clientHeight+3;}
function splitLongBlock(block,body){if(block.nodeType!==1)return null;const nodes=[];const tw=document.createTreeWalker(block,NodeFilter.SHOW_TEXT);while(tw.nextNode())if(tw.currentNode.textContent.trim())nodes.push(tw.currentNode);if(!nodes.length)return null;const floor=body.getBoundingClientRect().bottom-parseFloat(getComputedStyle(body).paddingBottom)-4;let chosen=null;for(const node of nodes){const str=node.textContent;let lo=0,hi=str.length;while(lo<hi){const mid=Math.ceil((lo+hi)/2);const r=document.createRange();r.setStart(node,Math.max(0,mid-1));r.setEnd(node,mid);const rect=r.getBoundingClientRect();if(rect.bottom<=floor)lo=mid;else hi=mid-1;}if(lo<str.length){if(lo===0&&node===nodes[0])return null;chosen={node,offset:lo};break;}}if(!chosen)return null;const range=document.createRange();range.setStart(chosen.node,chosen.offset);range.selectNodeContents(block);range.setStart(chosen.node,chosen.offset);const frag=range.extractContents();if(!frag.textContent.trim())return null;const clone=block.cloneNode(false);clone.append(frag);return clone;}
function paginate(){
 if(layoutBusy)return;layoutBusy=true;
 $all('.pagewrap').forEach(w=>w.hidden=false);
 try{
  const pages=getChapter().pages;
  let operations=0;
  for(let i=0;i<pages.length&&operations<2000;i++){
   const body=$all('.page-body')[i];if(!body)break;
   while(overflow(body)&&operations<2000){
    operations++;
    const children=Array.from(body.childNodes);
    if(!children.length)break;
    const bbox=body.getBoundingClientRect();
    const threshold=bbox.bottom-parseFloat(getComputedStyle(body).paddingBottom)-3;
    const firstBad=children.findIndex(node=>{
      if(node.nodeType===1)return node.getBoundingClientRect().bottom>threshold;
      const range=document.createRange();range.selectNode(node);
      return range.getBoundingClientRect().bottom>threshold;
    });
    const splitAt=firstBad===-1?Math.max(0,children.length-1):firstBad;
    let carry;
    if(splitAt===0){
      carry=splitLongBlock(children[0],body);
      if(!carry){showToast('Tento dlouhý blok nejde automaticky rozdělit. Vlož nový odstavec.');break;}
    }else{
      carry=document.createDocumentFragment();
      for(let j=splitAt;j<children.length;j++)carry.appendChild(children[j]);
    }
    const next=getNextBody(i);
    next.insertBefore(carry,next.firstChild);
   }
  }
  $all('.page-body').forEach((b,i)=>{if(pages[i])pages[i].html=b.innerHTML;});
  refreshStats();
  if(operations)scheduleSave();
 }finally{layoutBusy=false;refreshPageVisibility();updateZoom();}
}

$('pageSetup').onclick=()=>{const p=getChapter().pages[selectedPage],dim=dimensions(p);openModal('Formát a orientace stránky','<label>Šířka v mm</label><input id="customWidth" type="number" min="50" max="500" value="'+dim[0]+'"><label>Výška v mm</label><input id="customHeight" type="number" min="50" max="500" value="'+dim[1]+'"><label>Orientace</label><select id="orientation"><option value="portrait">Na výšku</option><option value="landscape">Na šířku</option></select>',[{text:'Zrušit',fn:closeModal},{text:'Použít',primary:true,fn:()=>{p.size='CUSTOM';p.orientation='portrait';p.width=Math.max(50,Math.min(500,Number($('customWidth').value)||148));p.height=Math.max(50,Math.min(500,Number($('customHeight').value)||210));if($('orientation').value==='landscape'){p.orientation='landscape';[p.width,p.height]=[p.height,p.width];}closeModal();renderPages();saveNow();setTimeout(paginate,30);}}]);};

function showBooks(){saveNow();const books=state.books;const b=getBook();const options=books.map((bk,i)=>'<option value="'+i+'">'+escapeHtml(bk.title)+'</option>').join('');openModal('Moje knihy','<label>Otevřít knihu</label><select id="bookSelect">'+options+'</select><label>Nová kniha</label><input id="bookNewTitle" maxlength="150" placeholder="Název nové knihy">',[{text:'Smazat vybranou',fn:()=>{if(state.books.length===1){showToast('Poslední knihu nelze smazat.');return;}const selected=state.books[Number($('bookSelect').value)];if(!confirm('Opravdu smazat knihu „'+selected.title+'“?'))return;state.books=state.books.filter(x=>x.id!==selected.id);const current=state.books[0];state.activeBook=current.id;state.activeChapter=current.chapters[0].id;selectedPage=0;closeModal();render();saveNow();}},{text:'Otevřít',fn:()=>{const selected=state.books[Number($('bookSelect').value)];state.activeBook=selected.id;state.activeChapter=selected.chapters[0].id;selectedPage=0;closeModal();render();saveNow();}},{text:'Nová kniha',primary:true,fn:()=>{const newTitle=$('bookNewTitle').value.trim()||'Nová kniha';const newBook=makeBook(newTitle);state.books.push(newBook);state.activeBook=newBook.id;state.activeChapter=newBook.chapters[0].id;selectedPage=0;closeModal();render();saveNow();}}]);$('bookSelect').value=String(books.findIndex(item=>item.id===b.id));}
$('findBtn').onclick=()=>{openModal('Hledat a nahradit','<label>Hledat</label><input id="findText" placeholder="Hledaný text"><label>Nahradit za</label><input id="replaceText" placeholder="Nový text"><p>Prohledá všechny kapitoly aktuální knihy.</p>',[{text:'Zrušit',fn:closeModal},{text:'Najít počet',fn:()=>{saveNow();const find=$('findText').value;if(!find)return;const hits=getBook().chapters.reduce((t,c)=>t+c.pages.reduce((q,p)=>{const d=document.createElement('div');d.innerHTML=p.html;return q+(d.textContent.toLocaleLowerCase('cs').split(find.toLocaleLowerCase('cs')).length-1);},0),0);showToast('Nalezeno '+hits+' výskytů.');}},{text:'Nahradit vše',primary:true,fn:()=>{saveNow();const find=$('findText').value;if(!find)return;let replaced=0;for(const c of getBook().chapters)for(const p of c.pages){const d=document.createElement('div');d.innerHTML=p.html;const tw=document.createTreeWalker(d,NodeFilter.SHOW_TEXT);const texts=[];while(tw.nextNode())texts.push(tw.currentNode);for(const node of texts){const re=new RegExp(escapeRegex(find),'gi');node.textContent=node.textContent.replace(re,()=>{replaced++;return $('replaceText').value;});}p.html=d.innerHTML;}closeModal();render();saveNow();showToast('Nahrazeno '+replaced+' výskytů.');}}]);};
const escapeRegex=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const escapeHtml=str=>String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeName=s=>(s||'Kniha').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,65)||'Kniha';
function encodeBase64(bytes){let out='';for(let i=0;i<bytes.length;i+=8192)out+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(out);}
function download(name,type,bytes){if(window.AndroidBridge&&typeof window.AndroidBridge.saveFile==='function'){window.AndroidBridge.saveFile(name,type,encodeBase64(bytes));showToast('Vyber, kam soubor uložit.');return;}const blob=new Blob([bytes],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);showToast('Soubor je připraven ke stažení.');}
const enc=new TextEncoder();function downloadText(name,mime,content){download(name,mime,enc.encode(content));}

function imageDataParts(uri){const m=/^data:image\/(png|jpeg|webp);base64,([a-zA-Z0-9+/=]+)$/.exec(uri||'');if(!m)return null;const bin=atob(m[2]),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return {mime:'image/'+m[1],ext:m[1]==='jpeg'?'jpg':m[1],bytes};}
function compressImage(file){return new Promise((resolve,reject)=>{if(file.size>18000000){reject(Error('Obrázek je příliš velký.'));return;}const reader=new FileReader();reader.onerror=()=>reject(Error('Nelze přečíst obrázek.'));reader.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1100/img.width,1500/img.height);const can=document.createElement('canvas');can.width=Math.max(1,Math.round(img.width*k));can.height=Math.max(1,Math.round(img.height*k));can.getContext('2d').drawImage(img,0,0,can.width,can.height);resolve({uri:can.toDataURL('image/jpeg',0.72),width:can.width,height:can.height});};img.onerror=()=>reject(Error('Nepodporovaný obrázek.'));img.src=reader.result;};reader.readAsDataURL(file);});}

F-8"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/><w:sz w:val="24"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:rPr><w:b/><w:sz w:val="36"/></w:rPr></w:style>'+[1,2,3].map((i)=>'<w:style w:type="paragraph" w:styleId="Heading'+i+'"><w:name w:val="heading '+i+'"/><w:rPr><w:b/><w:sz w:val="'+(36-(i-1)*6)+'"/></w:rPr></w:style>').join('')+'</w:styles>';const core='<?xml version="1.0" encoding="UTF-8"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>'+wesc(b.title)+'</dc:title><dc:creator>'+wesc(b.author)+'</dc:creator></cp:coreProperties>';const extendedRel=docRel.replace('</Relationships>',Array.from(docxImages.values()).map(im=>'<Relationship Id="rId'+im.id+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="'+im.path+'"/>').join('')+'</Relationships>');const extendedTypes=ct.replace('</Types>','<Default Extension="jpg" ContentType="image/jpeg"/><Default Extension="png" ContentType="image/png"/><Default Extension="webp" ContentType="image/webp"/></Types>');return zipStore({'[Content_Types].xml':extendedTypes,'_rels/.rels':rel,'word/document.xml':wordXML(),'word/_rels/document.xml.rels':extendedRel,'word/styles.xml':styles,'docProps/core.xml':core,...docImages});}
window.BookForgeTest={makeDocx,getState:()=>state,setState:s=>{state=validateState(s);selectedPage=0;render();saveNow();},allPages,wordXML,paginate};
